[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy Census Monkey Typewriter
[[redirects]]
  from = "/cmt/*"
  to = "https://dshkolcmt.netlify.app/:splat"
  status = 200

# Proxy The D-AI-LY
[[redirects]]
  from = "/thedaily/*"
  to = "https://dshkol-thedaily.netlify.app/:splat"
  status = 200
  force = true
